name: E2E SSH (manual)

on:
  workflow_dispatch:
    inputs:
      enable_e2e:
        type: boolean
        description: 'Run E2E SSH tests (requires Docker)'
        default: true

jobs:
  e2e:
    if: ${{ inputs.enable_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional --ignore-scripts

      - name: Install Playwright browsers
        run: npm run e2e:setup

      - name: Build
        run: npm run build

      - name: Run E2E tests with containerized sshd
        env:
          ENABLE_E2E_SSH: '1'
        run: npx --no-install playwright test -c playwright.config.ts tests/playwright/e2e-ssh-acceptenv-v2.spec.ts

      - name: Upload Playwright report (if present)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: |
            test-results
            playwright-report
